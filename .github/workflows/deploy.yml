name: Deploy

# Logs in to the server over SSH and runs deploy/update.sh. CI calls this as its last job once every check
# passes on main; it can also be started by hand from the Actions tab.
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST  server address
#   DEPLOY_USER  SSH user (e.g. root)
#   DEPLOY_KEY   private key whose public half is in that user's ~/.ssh/authorized_keys
#   DEPLOY_PORT  optional, SSH port (default 22)
# On the server the key can be limited to this one job; see docs/deploy.md.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Update the server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Check that the server is configured
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::DEPLOY_HOST is not set; skipping deploy."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update on the server
        if: steps.cfg.outputs.skip != '1'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if ! ssh-keyscan -T 20 -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Cannot reach SSH on the server at port ${PORT:-22}. Check DEPLOY_HOST and DEPLOY_PORT, and that the server's firewall (and the provider's) lets GitHub's machines in on that port."
            exit 1
          fi
          ssh -i ~/.ssh/deploy -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$USER@$HOST" \
            'cd /opt/daroon && ./deploy/update.sh'
