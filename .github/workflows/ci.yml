name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels older runs, except on main: there a run that is already deploying must not be cut off
# mid-update. Main runs queue instead, and only the newest queued one is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: daroon, POSTGRES_PASSWORD: daroon, POSTGRES_DB: daroon_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daroon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://daroon:daroon@localhost:5432/daroon_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # the browser tests take ~15 minutes on one machine; seven machines share them, so the slow layout tests land
    # on different machines
    name: Browser tests (${{ matrix.shard }}/7)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: daroon, POSTGRES_PASSWORD: daroon, POSTGRES_DB: daroon_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daroon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_API: '1'
      DATABASE_URL: postgres://daroon:daroon@localhost:5432/daroon_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daroon/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t daroon-api .
      - run: docker build -f deploy/web.Dockerfile -t daroon-web .

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, images]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
