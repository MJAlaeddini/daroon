name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: daroon, POSTGRES_PASSWORD: daroon, POSTGRES_DB: daroon_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daroon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://daroon:daroon@localhost:5432/daroon_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: daroon, POSTGRES_PASSWORD: daroon, POSTGRES_DB: daroon_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daroon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_API: '1'
      DATABASE_URL: postgres://daroon:daroon@localhost:5432/daroon_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daroon/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t daroon-api .
      - run: docker build -f deploy/web.Dockerfile -t daroon-web .
