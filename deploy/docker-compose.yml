# Production stack for one server: PostgreSQL, the API, and Caddy serving the app with HTTPS.
# Usage (from the repository root on the server): docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: daroon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daroon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: daroon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daroon -d daroon']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://daroon:${POSTGRES_PASSWORD}@db:5432/daroon
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in deploy/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: 'true'
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STORY_API_URL: ${STORY_API_URL:-}
      STORY_API_KEY: ${STORY_API_KEY:-}
      STORY_MODEL: ${STORY_MODEL:-}
      STORIES_PER_DAY: ${STORIES_PER_DAY:-12}

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    # HTTP_BIND / HTTPS_BIND choose the host ports. Defaults take 80 and 443; port mode moves them aside.
    ports:
      - '${HTTP_BIND:-80}:80'
      - '${HTTPS_BIND:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
